name: scheduler
description: "Ders Programı Oluşturucu - Course Schedule Builder"
publish_to: 'none'

version: 26.1.2+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management
  hooks_riverpod: ^3.0.0
  riverpod_annotation: ^4.0.0
  flutter_hooks: ^0.21.3+1
  
  # Data Models
  freezed_annotation: ^3.1.0
  json_annotation: ^4.8.1
  
  # Storage (Web-compatible)
  shared_preferences: ^2.2.2
  shared_preferences_web: ^2.3.0
  
  # File Operations (Web-compatible)
  file_picker: ^10.3.2
  
  # Export (Web-compatible)
  printing: ^5.11.1
  pdf: ^3.10.7
  
  # Internationalization
  intl: ^0.20.2
  
  # Utils
  collection: ^1.18.0
  package_info_plus: ^9.0.0
  
  # Firebase
  firebase_core: ^4.1.0
  firebase_analytics: ^12.0.1
  firebase_core_web: ^3.1.0
  firebase_analytics_web: ^0.6.0+1
  cloud_firestore: ^6.1.1
  
  # UI
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.0
  url_launcher_web: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  
  # Code Generation
  build_runner: ^2.6.0
  freezed: ^3.2.3
  json_serializable: ^6.11.1
  riverpod_generator: ^4.0.0+1
  
  # Testing
  mocktail: ^1.0.2

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
